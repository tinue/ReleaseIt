[package]
name = "releaseit"
version = "0.1.0"
edition = "2024"
description = "Config-driven release tool: GitHub pre-releases, in-place promotion, next-cycle bump, Xcode DMG and App Store builds"
license-file = "LICENSE"

[[bin]]
name = "release"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
imagesize = "0.15.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
md5 = "0.8.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"

[dev-dependencies]
base64 = "0.23.1"
